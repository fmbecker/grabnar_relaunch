name: cms
on:
  # docs/ feeds import_legacy, which the tests exercise.
  push: { paths: ["cms/**", "docs/**", ".github/workflows/cms.yml"] }
  workflow_dispatch: {}   # rebuild the image by hand (Actions → cms → Run workflow)
  pull_request: { paths: ["cms/**", "docs/**"] }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: cms } }
    steps:
      - uses: actions/checkout@v5
      # Cache disabled: the post-step "uv cache prune" failed sporadically and turned green runs red.
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: false }
      - run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Django checks
        run: |
          uv run manage.py check
          uv run manage.py makemigrations --check --dry-run
      - name: Seed (import_legacy)
        run: uv run manage.py migrate -v 0 && uv run manage.py seed_dev
      - name: Tests
        run: uv run pytest -q

  image:
    # Builds the production image. Pushed to ghcr.io only from main, after the checks passed;
    # on other branches and PRs it is only built, so a broken Dockerfile still turns CI red.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: cms-image-${{ github.ref }}
      cancel-in-progress: false
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - name: Code version (tree hash of cms/)
        id: tree
        # Same value deploy/deploy.sh computes, so the server pulls exactly the image for its checkout.
        run: echo "hash=$(git rev-parse --short=12 HEAD:cms)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/grabnar-cms
          tags: |
            type=raw,value=cms-${{ steps.tree.outputs.hash }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=grabnar-cms
            org.opencontainers.image.description=Wagtail-CMS für www.grabnar.de
      - uses: docker/build-push-action@v7
        with:
          context: cms
          platforms: linux/amd64   # Linode VPS
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cms
          cache-to: type=gha,scope=cms,mode=max
      - name: Summary
        if: env.PUSH == 'true'
        run: |
          {
            echo "### CMS-Image"
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
