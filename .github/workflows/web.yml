name: web
on:
  push: { paths: ["web/**", "cms/**", ".github/workflows/web.yml"] }
  pull_request: { paths: ["web/**", "cms/**"] }
jobs:
  build:
    # Builds against a freshly seeded CMS so the block contract is verified end to end.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - name: Start seeded CMS
        working-directory: cms
        run: |
          uv sync --frozen
          uv run manage.py migrate -v 0
          uv run manage.py seed_dev
          nohup uv run manage.py runserver 127.0.0.1:8000 > /tmp/cms.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v2/settings/ && break; sleep 1; done
      - working-directory: web
        run: pnpm install --frozen-lockfile
      - working-directory: web
        run: pnpm lint && pnpm check
      - working-directory: web
        env:
          WAGTAIL_API_URL: http://127.0.0.1:8000/api/v2
          WAGTAIL_MEDIA_URL: http://127.0.0.1:8000
          PUBLIC_SITE_URL: https://www.grabnar.de
          PUBLIC_FORMS_API_URL: https://www.grabnar.de/api/forms
        run: pnpm build && node scripts/redirects.mjs
