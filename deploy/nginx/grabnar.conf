# Phase 2: www.grabnar.de live on the new VPS; mbg.aivii.de redirects there.
#   sudo ln -sfn /srv/grabnar/repo/deploy/nginx/grabnar.conf /etc/nginx/sites-enabled/grabnar.conf
# Only once the certificate exists (docs/09-domainumzug.md):
#   sudo certbot certonly --webroot -w /var/www/certbot -d www.grabnar.de -d grabnar.de
#
# Includes site.conf, security-headers.conf and cms-proxy.conf straight from the repo checkout
# (/srv/grabnar/repo/deploy/nginx/), so changes arrive with every deploy; build-web.sh runs
# `nginx -t` before reloading. Link exactly ONE of grabnar-staging.conf / grabnar.conf into
# /etc/nginx/sites-enabled/ – both define $grabnar_redirect.
#
# Requires nginx 1.30.7+ (stable) or 1.31.9+ (mainline): older versions have remotely
# exploitable bugs (CVE-2026-123007 and others, 18.11.2026). deploy.sh refuses to run on an
# older nginx – see deploy/check-nginx.sh.
#
# HTTP/2 is on in every 443 server block (nginx 1.30.7 on the server, i.e. a fixed version).
# Keep `http2 on;` next to each `listen 443 ssl;` – check-nginx.sh warns when it is missing.
#
# The domains have AAAA records pointing here, so every server block listens on IPv6 too.
# Without `listen [::]:…` an IPv6 visitor reaches nothing at all – and so does the Let's
# Encrypt check, which resolves AAAA before A.

# Old-URL redirects generated by web/scripts/redirects.mjs at build time.
# The wildcard tolerates the file missing before the first build (`nginx -t` would fail on it).
map $uri $grabnar_redirect {
    include /srv/grabnar/web/redirects.map*;
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name www.grabnar.de grabnar.de mbg.aivii.de;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://www.grabnar.de$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grabnar.de;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/www.grabnar.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.grabnar.de/privkey.pem;
    # No includeSubDomains here: it would force HTTPS on every *.grabnar.de, including
    # externally managed ones (mail, webmail). Add it only once all of them do HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://www.grabnar.de$request_uri;
}

# Staging domain: links shared during the test phase keep working.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mbg.aivii.de;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/mbg.aivii.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mbg.aivii.de/privkey.pem;
    return 301 https://www.grabnar.de$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.grabnar.de;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/www.grabnar.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.grabnar.de/privkey.pem;

    set $grabnar_robots "";   # indexable; /preview/ sets its own value in site.conf
    # Basic auth in front of /admin/ as an extra layer before the Wagtail login. "off" leaves
    # only that login; a realm string switches it on and then needs /etc/nginx/grabnar-cms.htpasswd.
    set $grabnar_cms_auth "off";
    include /srv/grabnar/repo/deploy/nginx/site.conf;
}
