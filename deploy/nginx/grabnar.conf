# /etc/nginx/sites-available/grabnar.conf  (symlink into sites-enabled)
# TLS: keep the existing certbot-managed server block; only the locations below change.

# Old-URL redirects generated by web/scripts/redirects.mjs at build time.
map $uri $grabnar_redirect {
    include /srv/grabnar/web/redirects.map;
    default "";
}

server {
    listen 80;
    server_name www.grabnar.de grabnar.de;
    return 301 https://www.grabnar.de$request_uri;
}

server {
    listen 443 ssl http2;
    server_name grabnar.de;
    # ssl_certificate ... (certbot)
    return 301 https://www.grabnar.de$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.grabnar.de;
    # ssl_certificate / ssl_certificate_key managed by certbot – keep existing lines.

    root /srv/grabnar/web/dist;
    index index.html;
    client_max_body_size 12m;   # CV uploads (10 MB limit enforced in the CMS)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    if ($grabnar_redirect != "") {
        return 301 $grabnar_redirect;
    }

    # --- Wagtail (Docker, 127.0.0.1:8000) ---------------------------------
    location /admin/ {
        # Restrict editing access. Pick ONE: IP allowlist or basic auth.
        # allow 203.0.113.10;   # Firma
        # allow 198.51.100.5;   # Felix
        # deny all;
        # auth_basic "Grabnar CMS";
        # auth_basic_user_file /etc/nginx/grabnar.htpasswd;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }
    location /django-admin/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }
    location /documents/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }
    location /media/ {
        alias /srv/grabnar/media/;
        expires 30d;
        add_header Cache-Control "public";
    }
    location /media/applications/ { deny all; }   # CVs only via admin/documents views
    location /django-static/ {
        alias /srv/grabnar/cms-static/;
        expires 365d;
    }

    # --- Live preview for editors (Astro SSR, grabnar-preview.service) ----
    # Only reachable with a signed token from the Wagtail admin; never cached/indexed.
    location /preview/ {
        proxy_pass http://127.0.0.1:4322;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
        # add_header here cancels the server-level headers, so repeat them:
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;   # embedded by the Wagtail admin (same origin)
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # --- Umami (optional, see docs/05-tracking.md) ------------------------
    # Serves the tracker and its collect endpoint under our own domain, so no extra
    # DNS record is needed and fewer blockers interfere. In the CMS then set
    #   Umami-Script-URL = https://www.grabnar.de/stats/script.js
    #   Umami-Host-URL   = https://www.grabnar.de/stats
    # The Umami dashboard itself stays off this domain (SSH tunnel or own vhost).
    # location = /stats/script.js {
    #     proxy_pass http://127.0.0.1:3000/script.js;
    #     include /etc/nginx/proxy_params;
    #     expires 1d;
    # }
    # location = /stats/api/send {
    #     proxy_pass http://127.0.0.1:3000/api/send;
    #     include /etc/nginx/proxy_params;
    # }

    # --- Static Astro site ----------------------------------------------
    location /_astro/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
