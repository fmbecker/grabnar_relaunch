# /etc/nginx/sites-available/grabnar.conf  (symlink into sites-enabled)
# TLS: keep the existing certbot-managed server block; only the locations below change.
#
# Includes security-headers.conf and cms-proxy.conf straight from the repo checkout
# (/srv/grabnar/repo/deploy/nginx/), so header changes arrive with every deploy;
# build-web.sh runs `nginx -t` before reloading.
#
# Requires nginx 1.30.7+ (stable) or 1.31.9+ (mainline): older versions have remotely
# exploitable bugs (CVE-2026-123007 and others, 18.11.2026). deploy.sh refuses to run on an
# older nginx – see deploy/check-nginx.sh.
#
# HTTP/2 is off. Turn it on (add `http2 on;` to both 443 server blocks) once
# `nginx -v` shows a fixed version – check-nginx.sh says so.

# Old-URL redirects generated by web/scripts/redirects.mjs at build time.
map $uri $grabnar_redirect {
    include /srv/grabnar/web/redirects.map;
    default "";
}

server {
    listen 80;
    server_name www.grabnar.de grabnar.de;
    server_tokens off;
    return 301 https://www.grabnar.de$request_uri;
}

server {
    listen 443 ssl;
    server_name grabnar.de;
    server_tokens off;
    # ssl_certificate ... (certbot)
    # No includeSubDomains here: it would force HTTPS on every *.grabnar.de, including
    # externally managed ones (mail, webmail). Add it only once all of them do HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://www.grabnar.de$request_uri;
}

server {
    listen 443 ssl;
    server_name www.grabnar.de;
    server_tokens off;
    # ssl_certificate / ssl_certificate_key managed by certbot – keep existing lines.

    root /srv/grabnar/web/dist;
    index index.html;
    client_max_body_size 12m;   # CV uploads (10 MB limit enforced in the CMS)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    if ($grabnar_redirect != "") {
        return 301 $grabnar_redirect;
    }

    # --- Wagtail (Docker, 127.0.0.1:8000) ---------------------------------
    # Wagtail admin and Django admin share one location, so the access restriction
    # below always covers both.
    location ~ ^/(admin|django-admin)/ {
        # Restrict editing access. Pick ONE: IP allowlist or basic auth.
        # allow 203.0.113.10;   # Firma
        # allow 198.51.100.5;   # Felix
        # deny all;
        # auth_basic "Grabnar CMS";
        # auth_basic_user_file /etc/nginx/grabnar.htpasswd;
        include /srv/grabnar/repo/deploy/nginx/cms-proxy.conf;
    }
    location /api/ {
        include /srv/grabnar/repo/deploy/nginx/cms-proxy.conf;
    }
    location /documents/ {
        include /srv/grabnar/repo/deploy/nginx/cms-proxy.conf;
    }
    location /media/ {
        alias /srv/grabnar/media/;
        expires 30d;
        add_header Cache-Control "public";
        include /srv/grabnar/repo/deploy/nginx/security-headers.conf;
        # Uploads (an SVG can carry script): never run anything when a file is opened directly.
        # Doesn't affect images shown on the pages.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }
    location /media/applications/ { deny all; }   # CVs only via admin/documents views
    location /django-static/ {
        alias /srv/grabnar/cms-static/;
        expires 365d;
    }

    # --- Live preview for editors (Astro SSR, grabnar-preview.service) ----
    # Only reachable with a signed token from the Wagtail admin; never cached/indexed.
    location /preview/ {
        proxy_pass http://127.0.0.1:4322;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # add_header here cancels the server-level headers, so include them again
        # (X-Frame-Options SAMEORIGIN: embedded by the Wagtail admin).
        include /srv/grabnar/repo/deploy/nginx/security-headers.conf;
    }

    # --- Umami (optional, see docs/05-tracking.md) ------------------------
    # Serves the tracker and its collect endpoint under our own domain, so no extra
    # DNS record is needed and fewer blockers interfere. In the CMS then set
    #   Umami-Script-URL = https://www.grabnar.de/stats/script.js
    #   Umami-Host-URL   = https://www.grabnar.de/stats
    # The Umami dashboard itself stays off this domain (SSH tunnel or own vhost).
    # location = /stats/script.js {
    #     proxy_pass http://127.0.0.1:3000/script.js;
    #     include /etc/nginx/proxy_params;
    #     expires 1d;
    # }
    # location = /stats/api/send {
    #     proxy_pass http://127.0.0.1:3000/api/send;
    #     include /etc/nginx/proxy_params;
    # }

    # --- Static Astro site ----------------------------------------------
    location /_astro/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        include /srv/grabnar/repo/deploy/nginx/security-headers.conf;
    }
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
    error_page 404 /404.html;

    # Every location without its own add_header inherits these; the others include the file.
    include /srv/grabnar/repo/deploy/nginx/security-headers.conf;
}
