# Security headers for every response of www.grabnar.de (static site, CMS, preview, media).
#
# Included by deploy/nginx/grabnar.conf in the server block AND in every location that sets
# its own add_header: Nginx inherits add_header from the server block only into locations
# that have no add_header of their own – a single Cache-Control line would otherwise drop
# all of these.
#
# The Content-Security-Policy of the pages is not here: Astro writes it as <meta> into every
# page with hashes for its inline scripts (web/astro.config.ts, web/src/lib/csp.ts).

# No includeSubDomains: mail, webmail, smtp, imap, shop and intranet under grabnar.de live on
# another server whose certificate only covers the bare grabnar.de, so none of them has a
# usable HTTPS. With includeSubDomains, one visit to www.grabnar.de would make the browser
# refuse their plain HTTP for a year, with no way to click past it. Add it only once every
# *.grabnar.de does HTTPS (the same note is on the apex block in grabnar.conf).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
# SAMEORIGIN, not DENY: the Wagtail admin shows the live preview in an iframe.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Staging and preview: "noindex, nofollow"; live: empty, and Nginx then omits the header.
# Every server block that includes this file must `set $grabnar_robots` (site.conf does for /preview/).
add_header X-Robots-Tag $grabnar_robots always;
