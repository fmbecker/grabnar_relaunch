# Security headers for every response of www.grabnar.de (static site, CMS, preview, media).
#
# Included by deploy/nginx/grabnar.conf in the server block AND in every location that sets
# its own add_header: Nginx inherits add_header from the server block only into locations
# that have no add_header of their own – a single Cache-Control line would otherwise drop
# all of these.
#
# The Content-Security-Policy of the pages is not here: Astro writes it as <meta> into every
# page with hashes for its inline scripts (web/astro.config.ts, web/src/lib/csp.ts).

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
# SAMEORIGIN, not DENY: the Wagtail admin shows the live preview in an iframe.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
