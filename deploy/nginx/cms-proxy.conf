# Proxy to Wagtail/Django (Docker, 127.0.0.1:8000) – included by the CMS locations in grabnar.conf.
proxy_pass http://127.0.0.1:8000;
include /etc/nginx/proxy_params;

# Nginx sends these for the whole site (security-headers.conf). Drop Django's own copies so each
# header goes out once – Django and Nginx would otherwise send two different Referrer-Policy values.
# Wagtail's Content-Security-Policy for served documents is kept.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
