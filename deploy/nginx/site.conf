# Site locations shared by grabnar-staging.conf (mbg.aivii.de) and grabnar.conf (www.grabnar.de),
# included inside their 443 server block. The server block sets $grabnar_robots before this.

root /srv/grabnar/web/dist;
index index.html;
client_max_body_size 12m;   # CV uploads (10 MB limit enforced in the CMS)

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/xml;

if ($grabnar_redirect != "") {
    return 301 $grabnar_redirect;
}

# --- Wagtail (Docker, 127.0.0.1:8000) ---------------------------------
# Wagtail admin and Django admin share one location, so the access restriction
# below always covers both.
location ~ ^/(admin|django-admin)/ {
    # Restrict editing access. Pick ONE: IP allowlist or basic auth.
    # allow 203.0.113.10;   # Firma
    # allow 198.51.100.5;   # Felix
    # deny all;
    # auth_basic "Grabnar CMS";
    # auth_basic_user_file /etc/nginx/grabnar.htpasswd;
    include /srv/grabnar/repo/deploy/nginx/cms-proxy.conf;
}
location /api/ {
    include /srv/grabnar/repo/deploy/nginx/cms-proxy.conf;
}
location /documents/ {
    include /srv/grabnar/repo/deploy/nginx/cms-proxy.conf;
}
location /media/ {
    alias /srv/grabnar/media/;
    expires 30d;
    add_header Cache-Control "public";
    include /srv/grabnar/repo/deploy/nginx/security-headers.conf;
    # Uploads (an SVG can carry script): never run anything when a file is opened directly.
    # Doesn't affect images shown on the pages.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
}
location /media/applications/ { deny all; }   # CVs only via admin/documents views
location /django-static/ {
    alias /srv/grabnar/cms-static/;
    expires 365d;
}

# --- Live preview for editors (Astro SSR, grabnar-preview.service) ----
# Only reachable with a signed token from the Wagtail admin; never cached/indexed.
location /preview/ {
    proxy_pass http://127.0.0.1:4322;
    include /srv/grabnar/repo/deploy/nginx/proxy-params.conf;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
    set $grabnar_robots "noindex, nofollow";   # sent by security-headers.conf
    # add_header here cancels the server-level headers, so include them again
    # (X-Frame-Options SAMEORIGIN: embedded by the Wagtail admin).
    include /srv/grabnar/repo/deploy/nginx/security-headers.conf;
}

# --- Umami (docs/05-tracking.md) --------------------------------------
# Serves the tracker and its collect endpoint under our own domain, so no extra
# DNS record is needed and fewer blockers interfere. In the CMS then set
#   Umami-Script-URL = https://<domain>/stats/script.js
#   Umami-Host-URL   = https://<domain>/stats
# The Umami dashboard itself is NOT exposed here: reach it with
#   ssh -L 3000:127.0.0.1:3000 felix@<server>  ->  http://localhost:3000
location = /stats/script.js {
    proxy_pass http://127.0.0.1:3000/script.js;
    include /srv/grabnar/repo/deploy/nginx/proxy-params.conf;
    expires 1d;
}
location = /stats/api/send {
    proxy_pass http://127.0.0.1:3000/api/send;
    include /srv/grabnar/repo/deploy/nginx/proxy-params.conf;
}

# --- OSM map tiles (Map.astro, docs/03-technik.md) --------------------
# The map must not make the visitor's browser talk to a third party, and the page CSP
# allows images from 'self' only – so the tiles pass through here. The OSMF tile usage
# policy (https://operations.osmfoundation.org/policies/tiles/) permits a caching proxy
# if it identifies itself with a contactable User-Agent, passes an accurate Referer and
# caches for at least 7 days. All three below; availability is best-effort and may be
# withdrawn without notice, see docs/03-technik.md for what to do then.
# `resolver` plus the variables in proxy_pass: the tile CDN changes addresses, so the
# name must be looked up at request time, not once at startup.
# Quoted: the regex contains braces, which nginx would otherwise read as a block.
location ~ "^/tiles/(?<tz>[0-9]|1[0-8])/(?<tx>[0-9]{1,6})/(?<ty>[0-9]{1,6})\.png$" {
    resolver 127.0.0.53 ipv6=off valid=300s;
    proxy_pass https://tile.openstreetmap.org/$tz/$tx/$ty.png;
    proxy_ssl_server_name on;
    proxy_set_header Host tile.openstreetmap.org;
    proxy_set_header User-Agent "M-B-Grabnar-Website/1.0 (+https://www.grabnar.de/impressum/)";
    proxy_set_header Referer "https://$host/";
    proxy_set_header Accept-Encoding "";
    # Nothing of ours leaves with the request: on the staging domain the whole server
    # block sits behind basic auth, and nginx would otherwise forward that Authorization
    # header – and any cookie – to the tile server.
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_cache grabnar_tiles;          # proxy_cache_path: http block, see deploy/README.md
    proxy_cache_valid 200 30d;          # policy minimum is 7 days
    proxy_cache_valid 404 410 1h;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie;
    # Nothing of the tile server's own answer reaches our visitors. Alt-Svc is the one that
    # actually breaks things: it would advertise HTTP/3 on *our* origin, which we do not
    # serve. Its HSTS header carries `preload`, which we must not claim for this domain, and
    # the CORS and cache headers are not ours either. The rest only names their infrastructure.
    proxy_hide_header Alt-Svc;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Via;
    proxy_hide_header X-Cache;
    proxy_hide_header X-Cache-Hits;
    proxy_hide_header X-Served-By;
    proxy_hide_header X-Timer;
    proxy_hide_header X-TileRender;
    expires 30d;
    add_header Cache-Control "public";
    # add_header above cancels the inherited ones, so include them again
    include /srv/grabnar/repo/deploy/nginx/security-headers.conf;
}

# --- Static Astro site ----------------------------------------------
location /_astro/ {
    expires 365d;
    add_header Cache-Control "public, immutable";
    include /srv/grabnar/repo/deploy/nginx/security-headers.conf;
}
location / {
    try_files $uri $uri/ $uri/index.html =404;
}
error_page 404 /404.html;

# Every location without its own add_header inherits these; the others include the file.
include /srv/grabnar/repo/deploy/nginx/security-headers.conf;
