# Phase 1: new VPS under mbg.aivii.de – complete site behind basic auth, never indexed.
#   sudo ln -s /srv/grabnar/repo/deploy/nginx/grabnar-staging.conf /etc/nginx/sites-enabled/grabnar.conf
# Certificate (DNS of aivii.de points here):
#   sudo certbot certonly --webroot -w /var/www/certbot -d mbg.aivii.de
# Access: sudo htpasswd -c /etc/nginx/grabnar-staging.htpasswd grabnar
# Phase 2 (domain switch): docs/09-domainumzug.md, then grabnar.conf instead of this file.
#
# Includes site.conf, security-headers.conf and cms-proxy.conf straight from the repo checkout
# (/srv/grabnar/repo/deploy/nginx/), so changes arrive with every deploy; build-web.sh runs
# `nginx -t` before reloading. Link exactly ONE of grabnar-staging.conf / grabnar.conf into
# /etc/nginx/sites-enabled/ – both define $grabnar_redirect.
#
# Requires nginx 1.30.7+ (stable) or 1.31.9+ (mainline): older versions have remotely
# exploitable bugs (CVE-2026-123007 and others, 18.11.2026). deploy.sh refuses to run on an
# older nginx – see deploy/check-nginx.sh.
#
# HTTP/2 is on in every 443 server block (nginx 1.30.7 on the server, i.e. a fixed version).
# Keep `http2 on;` next to each `listen 443 ssl;` – check-nginx.sh warns when it is missing.

# Old-URL redirects generated by web/scripts/redirects.mjs at build time.
# The wildcard tolerates the file missing before the first build (`nginx -t` would fail on it).
map $uri $grabnar_redirect {
    include /srv/grabnar/web/redirects.map*;
    default "";
}

server {
    listen 80;
    server_name mbg.aivii.de;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://mbg.aivii.de$request_uri; }
}

# www.grabnar.de / grabnar.de during the switch: once their DNS points here, this answers the
# Let's Encrypt check (certbot --webroot) before grabnar.conf – which needs the certificate –
# is linked. Everything else gets 503 for those few minutes.
server {
    listen 80;
    server_name www.grabnar.de grabnar.de;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        add_header Retry-After 600 always;
        return 503 "Die Website wird gerade umgezogen und ist in wenigen Minuten wieder erreichbar.\n";
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mbg.aivii.de;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/mbg.aivii.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mbg.aivii.de/privkey.pem;

    # Not public yet: everything behind basic auth (forms, preview and API calls from the
    # browser are same-origin and carry the login along). The build and the preview server
    # talk to the CMS on 127.0.0.1 and are not affected.
    auth_basic "Grabnar Relaunch - Vorschau";
    auth_basic_user_file /etc/nginx/grabnar-staging.htpasswd;

    set $grabnar_robots "noindex, nofollow";
    include /srv/grabnar/repo/deploy/nginx/site.conf;
}
