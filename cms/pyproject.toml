[project]
name = "grabnar-cms"
version = "0.1.0"
description = "Headless Wagtail CMS for www.grabnar.de"
requires-python = ">=3.12"
dependencies = [
    "wagtail>=7.3,<7.4",
    "django>=5.2,<5.3",
    "wagtail-headless-preview>=0.9,<1.0",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "django-cors-headers>=4.6",
    "django-environ>=0.12",
    "requests>=2.32",
    "whitenoise>=6.8",
    "markdown>=3.11.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "grabnar.settings.dev"
python_files = ["tests.py", "test_*.py"]
